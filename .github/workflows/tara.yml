name: Telegram indirim takibi

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Tara
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          git config user.name "indirim-botu"
          git config user.email "bot@users.noreply.github.com"
          TEST="${{ github.event.inputs.test }}" python3 bot.py
          git add state.json kelimeler.txt kanallar.txt
          if ! git diff --cached --quiet; then
            git commit -m "durum güncellendi [$(date '+%H:%M')]" || true
            git pull --rebase origin main || true
            git push || true
          fi
